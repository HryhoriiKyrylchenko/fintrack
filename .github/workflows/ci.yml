# Build and test on every pull request and on every push to main.
# The job name "Build and test" is the required status check on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs of a pull request, never runs on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Integration tests use this server (docs/LOCAL-SETUP.md).
  FINTRACK_TEST_MONGO: mongodb://localhost:27017/?replicaSet=rs0

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # 8.0 is the oldest supported server version (ARCHITECTURE 2.2). Transactions need a
      # replica set; GitHub service containers cannot pass --replSet, so it is started here.
      - name: Start MongoDB 8.0 (single-node replica set)
        run: |
          docker run --detach --name mongo --publish 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" > /dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          for attempt in $(seq 1 60); do
            if [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]; then
              docker exec mongo mongosh --quiet --eval "print('MongoDB', db.version(), 'is primary of rs0')"
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB did not become primary in time."
          docker logs mongo
          exit 1

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore FinTrack.sln

      - name: Build
        run: dotnet build FinTrack.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution FinTrack.sln --configuration Release --no-build
